:concurrency: 1

:queues:
  - default
  - stage_execution

# Run a second, dedicated Sidekiq process for `stage_execution` with
# `-c 1 -q stage_execution` in production (see docs/RUNBOOK.md). Jobs on
# this queue no longer block on the agent CLI (it runs detached and is
# polled across ticks), but concurrency 1 still matches the "one
# workflow's stage at a time" semantics the `processing` guard depends on.
